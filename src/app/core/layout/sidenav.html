<nav class="sidenav" [attr.aria-label]="'layout.mainNav' | translate">
  @for (section of groups; track section.group) {
    @if (section.group !== 'start') {
      <p class="group" [id]="'nav-group-' + section.group">
        {{ 'nav.groups.' + section.group | translate }}
      </p>
    }
    <ul [attr.aria-labelledby]="section.group === 'start' ? null : 'nav-group-' + section.group">
      @for (item of section.items; track item.path) {
        <li>
          <a
            [routerLink]="item.path"
            [class.active]="item.active()"
            [attr.aria-current]="item.active() ? 'page' : null"
            (click)="navigate.emit()"
          >
            @if (item.version) {
              <span class="version" aria-hidden="true">v{{ item.version }}</span>
            }
            <span>{{ item.labelKey | translate }}</span>
          </a>
        </li>
      }
    </ul>
  }
</nav>
